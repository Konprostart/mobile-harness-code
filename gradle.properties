# Host/CI build of the harness app keeps a large heap (it compiles the full Compose
# UI) but pins the metaspace cap so Metaspace exhaustion cannot kill the build. The
# on-device toolchain uses a RAM-derived profile (see GradleMemory.kt), defaulting to
# -Xmx1536m -XX:MaxMetaspaceSize=768m on mid-range phones.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Reproducible builds: enable the build cache so clean rebuilds are deterministic and faster.
org.gradle.caching=true
