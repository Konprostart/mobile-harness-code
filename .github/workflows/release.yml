name: Build & Release

# Builds an UNSIGNED release APK of the online flavor.
# Signing keys are intentionally NEVER present here: signing is done locally
# or manually by the maintainer (see scripts/build-play-release.sh).

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write # required to create GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default 'tools platform-tools' includes the deprecated 'tools'
          # package which no longer resolves; install only platform-tools.
          packages: platform-tools

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Fetch bundled agent runtime (agy)
        run: |
          mkdir -p dist/runtime-bundles
          URL="https://github.com/Konprostart/mobile-harness-code/releases/download/runtime-2026.09.4/pocketdev-agy-arm64-2026.09.1.tar.zst"
          FALLBACK="https://github.com/techjarves/Mobile-Harness/releases/download/runtime-2026.09.4/pocketdev-agy-arm64-2026.09.1.tar.zst"
          curl -fL --retry 3 --retry-delay 5 -o dist/runtime-bundles/pocketdev-agy-arm64-2026.09.1.tar.zst "$URL" || \
          curl -fL --retry 3 --retry-delay 5 -o dist/runtime-bundles/pocketdev-agy-arm64-2026.09.1.tar.zst "$FALLBACK"

      - name: Build unsigned online release APK
        run: ./gradlew :app:assembleOnlineRelease --no-daemon

      - name: Run unit tests
        run: ./gradlew :app:testOnlineReleaseUnitTest --no-daemon

      - name: Run lint
        run: ./gradlew :app:lintOnlineRelease --no-daemon

      - name: Generate SBOM + verify dependency licenses
        run: ./gradlew :app:licenseCheck --no-daemon

      - name: Prepare release artifacts
        run: |
          APK_DIR=app/build/outputs/apk/online/release
          APK="$APK_DIR/app-online-release-unsigned.apk"
          [ -f "$APK" ] || APK="$(find "$APK_DIR" -maxdepth 1 -name '*.apk' | head -1)"
          { [ -n "$APK" ] && [ -f "$APK" ]; } || { echo "No APK found in $APK_DIR"; exit 1; }
          cp "$APK" mobile-harness-online.apk
          SHA=$(sha256sum mobile-harness-online.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s mobile-harness-online.apk)
          echo "$SHA  mobile-harness-online.apk" > mobile-harness-online.apk.sha256
          VERSION_CODE=$(grep -m1 'versionCode = ' app/build.gradle.kts | grep -oE '[0-9]+')
          VERSION_NAME=$(grep -m1 'versionName = "' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          { [ -n "$VERSION_CODE" ] && [ -n "$VERSION_NAME" ]; } || { echo "Could not derive version from app/build.gradle.kts"; exit 1; }
          echo "Version: ${VERSION_NAME} (${VERSION_CODE})"
          URL="https://github.com/Konprostart/mobile-harness-code/releases/download/${GITHUB_REF_NAME}/mobile-harness-online.apk"
          cat > mobile-harness-update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "notes": "Mobile Harness Code — independent fork of Mobile Harness. AI router fallback chain: the Sidekick assistant automatically retries a user-configured backup model on rate limits (429), server errors (5xx) and timeouts, with fail-closed auth handling (401/403 never cascade) and a token budget, all visible in Developer Tools → Routing log. Also keeps Material 3 dynamic color (Monet), a draggable floating Sidekick button, in-app update, Telegram bot, Sidekick assistant with background research, Eco Mode (Token Saver), Developer Tools, session auto-recovery, release & signing, optional server sync, reproducible build + SBOM. This APK is SIGNED (V1+V2+V3); install mobile-harness-online.apk.",
            "artifacts": {
              "online": {
                "url": "${URL}",
                "sha256": "${SHA}",
                "sizeBytes": ${SIZE}
              }
            }
          }
          EOF
          echo "SHA256: ${SHA}"
          echo "SIZE:   ${SIZE}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-online-apk
          path: |
            mobile-harness-online.apk
            mobile-harness-online.apk.sha256
            mobile-harness-update.json
            app/build/reports/sbom/cyclonedx.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mobile-harness-online.apk
            mobile-harness-online.apk.sha256
            mobile-harness-update.json
            app/build/reports/sbom/cyclonedx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
